[project]
name = "wr-azure-service-bus"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    "azure-servicebus>=7.14,<7.15",
    "azure-identity>=1.19,<2",
    "keboola-component>=1.10.0",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola.datadirtest>=2.2.0",
    "mock>=5.2.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.16.0",
    "ty>=0.0.24",
]

[tool.ruff]
line-length = 120
target-version = "py314"
# Keep ruff on source only; ruff 0.16 reformats Python in Markdown, and docs/
# holds authored planning/spec artifacts that must not be reflowed.
extend-exclude = ["docs"]

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
    "G",   # flake8-logging-format – no f-strings / str.format in logging calls
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
