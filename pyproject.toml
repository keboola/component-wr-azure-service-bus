[project]
name = "wr-azure-service-bus"
dynamic = ["version"]
readme = "README.md"
requires-python = "~=3.14.0"
dependencies = [
    # capped <7.15: 7.15.0 removes the uamqp_transport parameter; this component is
    # pyamqp-only.
    "azure-servicebus>=7.14,<7.15",
    # capped <2: pin to the 1.x line; the next major may break the credential API.
    "azure-identity>=1.19,<2",
    "keboola-component>=1.10.0",
    "pydantic>=2.11.7",
]

[dependency-groups]
dev = [
    "keboola.datadirtest>=2.2.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.2",
    "ruff>=0.16.0",
    "ty>=0.0.24",
]

[tool.ruff]
line-length = 120
# target-version is inferred from project.requires-python (~=3.14.0).

[tool.ruff.lint]
extend-select = [
    "I",   # isort – import sorting
    "UP",  # pyupgrade – modern Python syntax
    "G",   # flake8-logging-format – no f-strings / str.format in logging calls
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ty.environment]
extra-paths = ["src"]
